<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports - Smart Tourist Safety Monitoring</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Dashboard CSS (shared) -->
  <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="brand">Smart Tourist Safety Monitoring System</div>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('tourist_dashboard') }}"><i class="bi bi-people"></i> Tourist Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('analytics') }}"><i class="bi bi-bar-chart"></i> Analytics</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('heatmaps') }}"><i class="bi bi-geo-alt"></i> Heat Maps</a></li>
      <li class="nav-item"><a class="nav-link active" href="{{ url_for('reports') }}"><i class="bi bi-file-earmark-text"></i> Reports</a></li>
      <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>
    <button class="btn btn-outline-light mt-3 ms-3" id="sidebarToggle"><i class="bi bi-chevron-left"></i></button>
  </div>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg top-navbar" id="topNavbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Reports</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="container-fluid mt-4">
      <!-- Filters Row -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Search..." id="searchBox">
        </div>
        <div class="col-md-3">
          <input type="date" class="form-control" id="dateFilter">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="riskLevelFilter">
            <option value="">All Risk Levels</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="reportTypeFilter">
            <option value="">All Report Types</option>
            <option value="tourist">Tourist Report</option>
            <option value="alert">Alert Report</option>
            <option value="incident">Incident Report</option>
            <option value="riskzone">Risk Zone Report</option>
          </select>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="row g-4" id="summaryCards">
        <!-- Cards will be injected by JS -->
      </div>

      <!-- Export Buttons -->
      <div class="d-flex justify-content-end my-3">
        <button class="btn btn-outline-primary me-2" id="exportPdf"><i class="bi bi-file-earmark-pdf"></i> Export PDF</button>
        <button class="btn btn-outline-success me-2" id="exportExcel"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
        <button class="btn btn-outline-secondary" id="printReport"><i class="bi bi-printer"></i> Print</button>
      </div>

      <!-- Report Table -->
      <div class="table-responsive">
        <table class="table table-hover" id="reportTable">
          <thead class="table-light"><tr id="tableHeader"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/reports.js') }}"></script>
  <script>
    document.getElementById('sidebarToggle').addEventListener('click', function () {
      const sidebar = document.getElementById('sidebar');
      const topNav = document.getElementById('topNavbar');
      const main = document.getElementById('mainContent');
      sidebar.classList.toggle('collapsed');
      topNav.classList.toggle('collapsed');
      main.classList.toggle('collapsed');
    });
  </script>
</body>
</html>
