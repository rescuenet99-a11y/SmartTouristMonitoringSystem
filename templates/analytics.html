<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics - Smart Tourist Safety Monitoring</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Dashboard CSS (theme) -->
  <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="brand">Smart Tourist Safety Monitoring System</div>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('tourist_dashboard') }}"><i class="bi bi-people"></i> Tourist Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="{{ url_for('analytics') }}"><i class="bi bi-bar-chart"></i> Analytics</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('heatmaps') }}"><i class="bi bi-geo-alt"></i> Heat Maps</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('reports') }}"><i class="bi bi-file-earmark-text"></i> Reports</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </li>
    </ul>
    <button class="btn btn-outline-light mt-3 ms-3" id="sidebarToggle"><i class="bi bi-chevron-left"></i></button>
  </div>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg top-navbar" id="topNavbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Analytics Dashboard</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="container-fluid mt-4">
      <!-- Filter Row -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <input type="date" class="form-control" id="dateFrom" placeholder="From Date">
        </div>
        <div class="col-md-4">
          <input type="date" class="form-control" id="dateTo" placeholder="To Date">
        </div>
        <div class="col-md-2">
          <select class="form-select" id="monthFilter">
            <option value="" selected>All Months</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>
        <div class="col-md-2">
          <select class="form-select" id="riskLevelFilter">
            <option value="" selected>All Risk Levels</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
      </div>

      <!-- Statistics Cards -->
      <div class="row g-4" id="statsCards">
        <!-- Cards will be injected by JS -->
      </div>

      <!-- Charts Grid -->
      <div class="row g-4 mt-4">
        <div class="col-lg-6 col-md-12">
          <div class="card h-100 shadow-sm rounded">
            <div class="card-body">
              <h5 class="card-title mb-3"><i class="bi bi-graph-up me-2"></i>Monthly Tourist Registrations</h5>
              <div id="chart-registrations" style="height:300px;"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-6 col-md-12">
          <div class="card h-100 shadow-sm rounded">
            <div class="card-body">
              <h5 class="card-title mb-3"><i class="bi bi-bar-chart-line me-2"></i>Tourist Activity by Month</h5>
              <div id="chart-activity" style="height:300px;"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-6 col-md-12">
          <div class="card h-100 shadow-sm rounded">
            <div class="card-body">
              <h5 class="card-title mb-3"><i class="bi bi-pie-chart me-2"></i>Alert Distribution</h5>
              <div id="chart-alerts" style="height:300px;"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-6 col-md-12">
          <div class="card h-100 shadow-sm rounded">
            <div class="card-body">
              <h5 class="card-title mb-3"><i class="bi bi-clipboard-data me-2"></i>Incident Trend</h5>
              <div id="chart-incidents" style="height:300px;"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-6 col-md-12">
          <div class="card h-100 shadow-sm rounded">
            <div class="card-body">
              <h5 class="card-title mb-3"><i class="bi bi-histogram me-2"></i>Safety Score Distribution</h5>
              <div id="chart-safety-score" style="height:300px;"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-6 col-md-12">
          <div class="card h-100 shadow-sm rounded">
            <div class="card-body">
              <h5 class="card-title mb-3"><i class="bi bi-map me-2"></i>Risk Zone Distribution</h5>
              <div id="chart-risk-zones" style="height:300px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
  <script>
    // Sidebar toggle (shared with other pages)
    document.getElementById('sidebarToggle').addEventListener('click', function () {
      const sidebar = document.getElementById('sidebar');
      const topNav = document.getElementById('topNavbar');
      const main = document.getElementById('mainContent');
      sidebar.classList.toggle('collapsed');
      topNav.classList.toggle('collapsed');
      main.classList.toggle('collapsed');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
