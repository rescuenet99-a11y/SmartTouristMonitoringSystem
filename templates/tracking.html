<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tourist Tracking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tracking.css') }}">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        🌍 Live Tourist Tracking
    </h2>

    <div class="card p-4 shadow">

        <button class="btn btn-success mb-3" onclick="getLocation()">
            Start Tracking
        </button>
        <button class="btn btn-danger mt-2" onclick="stopTracking()">
    Stop Tracking
</button>

        <h5>Latitude :
            <span id="lat">--</span>
        </h5>

        <h5>Longitude :
            <span id="lon">--</span>
        </h5>

        <h5>Status :
            <span id="status">Waiting...</span>
        </h5>

    </div>

</div>

<script src="{{ url_for('static', filename='js/tracking.js') }}"></script>

</body>
</html>
