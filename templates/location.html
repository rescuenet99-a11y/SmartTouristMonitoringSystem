<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Location</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Share Your Location</h2>
    <p class="text-center" id="status">Requesting location permission...</p>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const touristId = {{ tourist_id }};
    function sendLocation(lat, lon) {
      fetch('/api/update_location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tourist_id: touristId, latitude: lat, longitude: lon })
      })
        .then(res => res.json())
        .then(data => {
          statusEl.textContent = data.status === 'ok' ? 'Location saved!' : 'Error saving location';
        })
        .catch(err => {
          statusEl.textContent = 'Error sending location.';
        });
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          statusEl.textContent = `Latitude: ${latitude.toFixed(6)}, Longitude: ${longitude.toFixed(6)}`;
          sendLocation(latitude, longitude);
        },
        err => {
          statusEl.textContent = 'Location permission denied.';
        }
      );
    } else {
      statusEl.textContent = 'Geolocation not supported.';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
