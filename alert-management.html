<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alert Management – Smart Tourist Safety</title>
  <meta name="description" content="Configure and manage safety alerts, geo-fence warnings, and threat levels." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#112229;color:#212529;min-height:100vh}
    .bg-mesh{display:none}

    .page-wrapper{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
    .top-bar {
      background: rgba(6, 7, 10, 0.7);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.9rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar .brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
    }
    .top-bar .brand i {
      color: #f59e0b;
      margin-right: 0.45rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateX(-2px);
    }

    .content{flex:1;padding:2rem 1rem}
    h1{font-weight:800;font-size:2rem;text-align:center;margin-bottom:.5rem;color:#2563EB}
    .subtitle{text-align:center;color:#4b5563;max-width:500px;margin:0 auto 2rem;line-height:1.6}

    /* Stats row */
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;max-width:700px;margin:0 auto 2rem}
    .stat-box{background:#f8f9fa;border:1px solid #e5e7eb;border-radius:16px;padding:1.25rem;text-align:center}
    .stat-box .num{font-size:1.8rem;font-weight:800}
    .stat-box .label{font-size:.78rem;color:#4b5563;margin-top:.2rem}
    .num-red{color:#DC2626}
    .num-amber{color:#D97706}
    .num-green{color:#16A34A}

    /* Alert list */
    .alert-list{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
    .alert-item{background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:1.25rem 1.5rem;display:flex;align-items:flex-start;gap:1rem;transition:transform .2s;box-shadow:0 4px 15px rgba(0,0,0,0.03)}
    .alert-item:hover{transform:translateX(4px);border-color:#cbd5e1}
    .alert-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;flex-shrink:0}
    .icon-critical{background:#ef4444}
    .icon-warning{background:#f59e0b}
    .icon-info{background:#3b82f6}
    .icon-low{background:#22c55e}
    .alert-body{flex:1}
    .alert-body h4{font-size:.95rem;font-weight:700;margin-bottom:.25rem;color:#1f2937}
    .alert-body p{margin:0;font-size:.85rem;color:#4b5563;line-height:1.5}
    .alert-meta{display:flex;align-items:center;gap:.75rem;margin-top:.5rem;font-size:.78rem;color:#64748b}
    .alert-meta i{font-size:.85rem}
    .severity-pill{font-size:.7rem;font-weight:700;padding:.2rem .55rem;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
    .sev-critical{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
    .sev-warning{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
    .sev-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .sev-low{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}

    .main-container-card {
      max-width: 1000px;
      margin: 2rem auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      color: #212529;
    }

    footer{text-align:center;padding:2rem 1rem;color:#475569;font-size:.82rem;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
  </style>
</head>
<body>
  <div class="bg-mesh"><span></span><span></span></div>
  <div class="page-wrapper">
    <nav class="top-bar">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="brand" href="emergency-center.html"><i class="bi bi-exclamation-triangle-fill"></i>Alert Management</a>
        <a href="emergency-center.html" class="back-btn"><i class="bi bi-arrow-left"></i> Back to Emergency Center</a>
      </div>
    </nav>

    <div class="content">
      <div class="main-container-card">
        <h1>Alert Management</h1>
        <p class="subtitle">Monitor active alerts, configure geo-fence warnings, and manage threat levels across all regions.</p>

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-box">
            <div class="num num-red" id="criticalCount">0</div>
            <div class="label">Critical Alerts</div>
          </div>
          <div class="stat-box">
            <div class="num num-amber" id="warningCount">0</div>
            <div class="label">Warnings</div>
          </div>
          <div class="stat-box">
            <div class="num num-green" id="resolvedCount">0</div>
            <div class="label">Resolved Today</div>
          </div>
        </div>

        <!-- Alerts -->
        <div class="alert-list" id="alertList">
          <!-- Loaded dynamically from API -->
        </div>
      </div>
    </div>

    <footer>&copy; 2026 Smart Tourist Safety Monitoring System</footer>
  </div>

  <script>
    const API_BASE = window.location.port === '5000' ? '' : 'http://127.0.0.1:5000';

    async function loadAlerts() {
      try {
        const res = await fetch(`${API_BASE}/api/alerts`);
        const alerts = await res.json();

        // Calculate counts
        let critical = 0;
        let warning = 0;
        let resolved = 0;
        alerts.forEach(alt => {
          if (alt.severity === 'Critical') critical++;
          else if (alt.severity === 'Warning') warning++;
          else if (alt.severity === 'Resolved') resolved++;
        });
        document.getElementById('criticalCount').textContent = critical;
        document.getElementById('warningCount').textContent = warning;
        document.getElementById('resolvedCount').textContent = resolved + 24; // Base resolved count from template

        const list = document.getElementById('alertList');
        list.innerHTML = alerts.map(alt => `
          <div class="alert-item">
            <div class="alert-icon ${alt.icon_class}"><i class="bi ${alt.icon}"></i></div>
            <div class="alert-body">
              <h4>${alt.type}</h4>
              <p>${alt.desc}</p>
              <div class="alert-meta">
                <span><i class="bi bi-clock me-1"></i>${alt.time}</span>
                <span class="severity-pill ${alt.severity_class}">${alt.severity}</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error loading alerts:", err);
      }
    }

    // Initialize and reload periodically
    loadAlerts();
    setInterval(loadAlerts, 5000);
  </script>
</body>
</html>
